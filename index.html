<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Flashcard AI</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
    </div>
  </nav>

  <main class="home-page">

    <div class="hero-card">

      <h1>Create Smart Flashcards</h1>

      <p>
        Paste your notes below and instantly generate interactive flashcards.
      </p>

      <textarea id="inputText" placeholder="Paste your flashcard text here...

Front: What is AI?
Back: Artificial Intelligence"></textarea>

      <input type="text" id="deckTitle" placeholder="Deck title">

      <button id="generateBtn">Generate Flashcards</button>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
